name: Deploy new portfolio source
on:
  push:
    paths:
      - '.github/workflows/deploy-new-portfolio.yml'
jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode new site
        run: base64 -d site.gz.b64 | gzip -d > index.html
      - name: Commit site
        run: |
          rm site.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.gz.b64
          git commit -m "Replace portfolio with new site"
          git push
